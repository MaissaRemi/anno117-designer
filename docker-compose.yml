services:
  # Build de production servi par nginx. `docker compose up` suffit.
  #
  # Le port hote par defaut est 8090, PAS 8080, et c'est deliberé : 8080 est le port le plus
  # dispute de la machine, et surtout le defaut se lisait `${ANNO_PORT:-8080}`. Un `docker
  # compose up --build` lance sans exporter ANNO_PORT recreait donc le conteneur sur 8080 en
  # silence, l'onglet ouvert sur 8090 tombait, et ca ressemblait a un crash — alors que nginx
  # repondait 200. Le defaut vaut maintenant ce qu'on utilise vraiment.
  #
  # Surchargeable au besoin : ANNO_PORT=8080 docker compose up
  app:
    build: .
    image: anno117-designer:latest
    ports:
      - "${ANNO_PORT:-8090}:80"
    restart: unless-stopped

  # Serveur de developpement avec rechargement a chaud.
  # `docker compose --profile dev up dev`
  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Volume anonyme : garde les node_modules du conteneur (binaires Linux)
      # au lieu de ceux de l'hote, qui peuvent etre compiles pour un autre OS.
      - /app/node_modules
    profiles: ["dev"]
