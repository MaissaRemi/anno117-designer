server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Les assets sont hashes par Vite : jamais reutilises apres un rebuild.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les icones de batiments ne sont pas dans l'image (assets du jeu, non
    # redistribues). On repond 404 sans polluer les logs d'erreur : le front
    # retombe sur une pastille de couleur.
    location /icons/ {
        log_not_found off;
        try_files $uri =404;
    }

    # ═══ index.html NE DOIT JAMAIS ETRE MIS EN CACHE ═══════════════════════════════════
    #
    # C'est LE point qui rendait les correctifs invisibles cote utilisateur. index.html ne
    # portait aucun `Cache-Control` — seulement `Last-Modified` et un `ETag`. Sans directive
    # explicite, le navigateur applique un cache HEURISTIQUE : il garde la reponse sans
    # revalider pendant une fraction du temps ecoule depuis `Last-Modified`.
    #
    # Combine au `immutable` d'un an des assets, l'effet est durable : le HTML en cache pointe
    # vers l'ancien nom de bundle, ce bundle est lui-meme garde un an, et l'utilisateur
    # continue d'executer l'ANCIEN moteur apres chaque rebuild. Plusieurs correctifs de suite
    # ont ainsi paru « ne rien changer » — le nouveau code n'etait jamais charge.
    #
    # `no-cache` n'interdit pas le cache : il impose la REVALIDATION. Le navigateur garde la
    # copie, demande a chaque chargement si elle est encore bonne, et nginx repond 304 tant
    # que rien n'a bouge. Le cout est une requete conditionnelle sur un fichier de 400 octets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
