server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Les assets sont hashes par Vite : jamais reutilises apres un rebuild.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les icones de batiments ne sont pas dans l'image (assets du jeu, non
    # redistribues). On repond 404 sans polluer les logs d'erreur : le front
    # retombe sur une pastille de couleur.
    location /icons/ {
        log_not_found off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
